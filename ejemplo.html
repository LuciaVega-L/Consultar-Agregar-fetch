<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ejemplo</title>
    </head>
    <body>
        <form id="formularioEjemplo">
            <button type="submit" id="Ejemplo">Ejemplo</button>
            <p id="resultadoEjemplo"></p>
        </form>
        <form id="enviarDatosForm">
            <input type="text" id="nombre" name="nombre">
            <input type="text" id="username" name="username">
            <button type="submit" id="enviarDatos">Enviar Datos</button>
            <p id="resultadoEnvio"></p>
        </form>
        <script>
            document.getElementById("formularioEjemplo").addEventListener("submit", ejemplo);
            document.getElementById("enviarDatosForm").addEventListener("submit", enviarDatos);

            function ejemplo(event) {
                event.preventDefault();
                fetch('https://jsonplaceholder.typicode.com/users')
                .then(response=>response.json())
                .then(data=>{
                   document.getElementById("resultadoEjemplo").innerHTML = JSON.stringify(data);
                   for(const persona of data){
                    document.getElementById("resultadoEjemplo").innerHTML += `<br>${persona.id}: ${persona.name}</br>`;
                   }
                })
                .catch(error=>{console.log('error:',error);});             
            }
            function enviarDatos(event){
                event.preventDefault();
                fetch('https://jsonplaceholder.typicode.com/users/',{
                    method:'POST',
                    headers:{'content-type':'application/json'},
                    body:JSON.stringify({
                        name:document.getElementById("nombre").value,
                        username:document.getElementById("username").value
                    })
                })
                .then(response=>{
                    if(!response.ok){
                        throw new Error('error:'+response.status);
                    }else{
                        return response.json();
                    }
                })
                .then(data=>{
                    document.getElementById("resultadoEnvio").innerHTML = `${data.name}:${data.username}<br>`;              
                })
                .catch(error=>{console.log('error:',error);   
                });
            }
        </script>
    </body>
</html>
