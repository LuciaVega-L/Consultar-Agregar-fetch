<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ejercicios</title>
    </head>
    <body>
        <h1>Ejercicios</h1>
        <form id="formulario1">
            <label id="mostrar">mostrar contenido del php</label>
            <button type="submit" id="btnMostrar" name="mostrar">mostrar</button>
            <p id="resultadoMostrar"></p>
        </form>
        <form id="formulario2">
            <label id="agregar">agregar contenido al php</label>
            <input type="text" id="producto" name="nombre">
            <input type="number" id="precio" name="precio">
            <button type="submit" id="btnAgregar">agregar</button>
        </form>
        <form id="guardarVariables">
            <label id="guardar">guardar variables en el php, ingrese el id</label>
            <input type="text" id="guardarVariable" name="guardarVariable">
            <button type="button" id="btnGuardar">guardar</button>
            <p id="resultadoVariable"></p>
        </form>

        
        <script>

            /*variable global*/
            let nombre = "";

            document.getElementById("formulario1").addEventListener("submit", mostrarContenido);
            function mostrarContenido(event) {
                event.preventDefault();
                fetch('http://localhost/productos.php')
                .then(response=>response.json())
                .then(data=>{
                    document.getElementById("resultadoMostrar").innerHTML=JSON.stringify(data);
                })         
                .catch(error=>console.log('error:',error));
            }
            document.getElementById("formulario2").addEventListener("submit",agregar);
            function agregar(event){
                event.preventDefault();
                fetch('http://localhost/productos.php',{
                    method:'POST',
                    headers:{'content-type':'application/json'},
                    body:JSON.stringify({
                        nombre:document.getElementById("producto").value,
                        precio:document.getElementById("precio").value
                    })
                })
                .then(response=>{
                    if(!response.ok){
                        throw new Error('Error en la solicitud');
                    }else{
                        return response.json();
                    }
                })
                .catch(error=>console.log('error:',error));
            }
            document.getElementById("btnGuardar").addEventListener("click", guardar);
            async function guardar(id) {

                id = document.getElementById("guardarVariable").value;
                try {
                    const response = await fetch(`http://localhost/productos.php?id=${id}`)
                    if (!response.ok) {
                        throw new Error('Error en la solicitud');
                    }
                    const data = await response.json();
                    nombre = data.nombre;
                    document.getElementById("resultadoVariable").innerHTML = `Variable guardada: ${nombre}`;
                } catch (error) {
                    console.log('error:', error);
                }
            }
        </script>
    </body>
</html>
